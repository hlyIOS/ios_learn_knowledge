<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一次 setter，两次人生 · _UIAppearance</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · _UIAppearance</p>
    <h1>One setter, two lifetimes</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uia-seq-title uia-seq-desc">
      <title id="uia-seq-title">One setter, two lifetimes</title>
      <desc id="uia-seq-desc">Sequence showing an appearance setter recorded on the proxy at launch, then replayed onto a real view when that view enters a window.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="128" y1="104" x2="128" y2="492" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="352" y1="104" x2="352" y2="492" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="584" y1="104" x2="584" y2="492" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="104" x2="800" y2="492" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="348" y="156" width="8" height="116" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="580" y="304" width="8" height="108" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="348" y="348" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Actors -->
      <rect x="56" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="40" width="144" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="128" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App</text>

      <rect x="280" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="40" width="144" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="352" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proxy</text>

      <rect x="512" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">View</text>

      <rect x="728" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Window</text>

      <!-- Messages -->
      <line x1="128" y1="160" x2="348" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="196" y="140" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="238" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">+appearance</text>

      <line x1="128" y1="200" x2="348" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="176" y="180" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="189" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">setTitleColor:</text>

      <path d="M 360,240 H 404 Q 412,240 412,248 V 256 Q 412,264 404,264 H 360"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="244" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="474" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">forwardInvocation</text>

      <!-- Callout: gap -->
      <text x="480" y="296" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">No views yet — the ledger just waits.</text>

      <line x1="584" y1="320" x2="800" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="640" y="300" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">didMoveToWindow</text>

      <line x1="800" y1="360" x2="360" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="500" y="340" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">_applyInvocationsTo:</text>

      <line x1="360" y1="400" x2="580" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="408" y="380" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="389" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">invokeWithTarget:</text>

      <!-- Legend -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="540" x2="148" y2="540" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="156" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Call</text>

      <line x1="216" y1="540" x2="244" y2="540" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="252" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Record / replay</text>

      <rect x="400" y="532" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="416" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Activation</text>
    </svg>
  </div>
</body>
</html>
